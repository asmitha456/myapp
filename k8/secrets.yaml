apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: myapp-database
type: Opaque
data:
  mysql-root-password: cGFzc3dvcmQ=   # "password" in base64
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: myapp
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: cGFzc3dvcmQ=   # "password" in base64
